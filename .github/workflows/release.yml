# Builds the Windows installer and the portable exe on a GitHub runner and attaches both to a
# release, so colleagues can download a finished installer instead of building one.
#
#   git tag v0.9.0-beta.5 && git push --tags     -> release with both exes
#   Actions > Release > Run workflow             -> build only, nothing published
#
# The version in package.json must match the tag (electron-builder names the files after it).
#
# Why this job uses no marketplace actions: the repository is called "Bench." and Windows folders
# cannot end in a period. The runner creates D:\a\Bench\Bench but then refers to D:\a\Bench.\Bench.,
# which does not exist, and every JavaScript action (checkout, setup-node, upload, release) fails to
# start. Shell steps with their own working folder are fine, and git, node, npm and gh are preinstalled.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: D:\a\src

    steps:
      - name: Clone the tag
        working-directory: D:\a
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src

      - name: Toolchain
        run: |
          node -v
          npm -v
          gh --version

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = "v$(node -p "require('./package.json').version")"
          if ($v -ne "${{ github.ref_name }}") { throw "package.json is $v, tag is ${{ github.ref_name }}" }

      - name: Fetch photographs
        shell: cmd
        run: call fetch-photos.bat nopause

      - name: Tests and lint
        run: |
          npm test
          npm run lint

      - name: Build the interface
        run: npm run build

      - name: better-sqlite3 built for the app's Electron (roadmap 109)
        run: |
          $ev = node -p "require('electron/package.json').version"
          Push-Location node_modules\better-sqlite3
          npx prebuild-install -r electron -t $ev --arch x64
          if ($LASTEXITCODE -ne 0) { throw "no better-sqlite3 prebuild for Electron $ev" }
          Pop-Location

      - name: Package installer and portable exe
        run: npx electron-builder --win nsis portable --publish never

      # Roadmap 94: the release is not the first install. Silent install into the runner's profile, start the
      # app, expect it to stay alive and write its log, stop it, silent uninstall, expect the folder gone.
      - name: Install, start and uninstall the built installer
        run: |
          $setup = (Get-ChildItem release\Bench-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Bench'
          $exe = Join-Path $dir 'Bench.exe'
          if (-not (Test-Path $exe)) { throw "no $exe after install" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "Bench exited within 25 s, code $($app.ExitCode)" }
          $log = Join-Path $env:APPDATA 'bench\bench.log'
          $user = Join-Path $env:APPDATA 'bench\user'
          if (-not (Test-Path $user)) { throw "Bench did not create its user folder at $user" }
          if (Test-Path $log) { Write-Host "--- bench.log ---"; Get-Content $log -Tail 40 }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process Bench -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $un = Join-Path $dir 'Uninstall Bench.exe'
          if (-not (Test-Path $un)) { throw "no uninstaller at $un" }
          $u = Start-Process -FilePath $un -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw "Bench.exe still there after uninstall" }
          Write-Host "install, start, uninstall: ok"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $setup = "Bench-Setup-$($env:TAG.TrimStart('v')).exe"
          @"
          ## Install

          1. Under **Assets** below, download **$setup**.
          2. Run it. Windows says *Windows protected your PC* because the installer is not signed: click **More info**, then **Run anyway**.
          3. Next, Next, Install. No admin rights are needed; it installs into your own profile. The last page offers a desktop shortcut and opens the bench.
          4. First start asks for your name and work email, then offers the Microsoft 365 sign-in.

          **Bench-portable** is the same app without an installer: keep it in any folder and run it from there.

          Already have Bench.? Install over the old one; your board, hours and settings stay.

          ## What changed
          "@ | Set-Content -Encoding UTF8 notes.md

          # Roadmap 95: the roadmap is the changelog. Items ticked since the previous release, by number.
          $prev = $null
          try { $prev = gh release list --repo $env:REPO --limit 20 --json tagName,isPrerelease --jq "[.[] | select(.tagName != `"$env:TAG`")][0].tagName" } catch { $prev = $null }
          $old = ''
          if ($prev) {
            try {
              $b64 = gh api "repos/$env:REPO/contents/ROADMAP.md?ref=$prev" --jq .content
              $old = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($b64 -replace '\s', '')))
            } catch { $old = '' }
          }
          $pick = { param($text) [regex]::Matches($text, '(?m)^- \[x\] (\d+) (?:\[[A-Z-]\] )?(.*)$') | ForEach-Object { [pscustomobject]@{ n = [int]$_.Groups[1].Value; text = $_.Groups[2].Value.Trim() } } }
          $now = & $pick (Get-Content ROADMAP.md -Raw)
          $before = @{}
          foreach ($i in (& $pick $old)) { $before[$i.n] = $true }
          $fresh = $now | Where-Object { -not $before.ContainsKey($_.n) } | Sort-Object n
          if ($fresh) {
            $lines = $fresh | ForEach-Object { "- **$($_.n)** $($_.text)" }
            Add-Content -Encoding UTF8 notes.md (($lines -join "`n") + "`n")
            Write-Host "release notes: $($fresh.Count) roadmap items since $prev"
          } else {
            Add-Content -Encoding UTF8 notes.md "See ROADMAP.md for the items in this release.`n"
          }

          $files = Get-ChildItem release\*.exe | ForEach-Object { $_.FullName }
          $args = @("release", "create", $env:TAG) + $files + @("--repo", $env:REPO, "--title", "Bench. $env:TAG", "--notes-file", "notes.md", "--generate-notes")
          if ($env:TAG -match "-") { $args += "--prerelease" }
          $exists = $true
          try { gh release view $env:TAG --repo $env:REPO *> $null; if ($LASTEXITCODE -ne 0) { $exists = $false } } catch { $exists = $false }
          if ($exists) {
            gh release upload $env:TAG @files --repo $env:REPO --clobber
          } else {
            gh @args
          }
