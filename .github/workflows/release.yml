# Builds the Windows installer and the portable exe on a GitHub runner and attaches both to a
# release, so colleagues can download a finished installer instead of building one.
#
#   git tag v0.9.0-beta.2 && git push --tags     -> release with both exes
#   Actions > Release > Run workflow             -> build only, exes as a workflow artifact
#
# The version in package.json must match the tag (electron-builder names the files after it).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json is $v, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Fetch photographs
        shell: cmd
        run: call fetch-photos.bat nopause

      - name: Tests and lint
        run: |
          npm test
          npm run lint

      - name: Build the interface
        run: npm run build

      - name: Package installer and portable exe
        run: npx electron-builder --win nsis portable --publish never

      - name: Keep the exes as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bench-${{ github.ref_name }}
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bench. ${{ github.ref_name }}
          files: release/*.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            1. Under **Assets** below, download **Bench-Setup-${{ github.ref_name }}.exe** (drop the `v` from the file name if it does not match exactly; take the file that starts with `Bench-Setup`).
            2. Run it. Windows will say *Windows protected your PC* because the installer is not signed: click **More info**, then **Run anyway**.
            3. Next, Next, Install. No admin rights are needed; it installs into your own profile.
            4. First start asks for your name and work email, then offers the Microsoft 365 sign-in.

            **Bench-portable** is the same app without an installer: keep it in any folder and run it from there.

            Already have Bench.? Install over the old one; your board, hours and settings stay.

            ## What changed
